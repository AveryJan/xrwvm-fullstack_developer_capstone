<!doctype html><html><head><title>Post Review</title>{% include 'partials/head.html' %}</head><body>{% include 'partials/nav.html' %}<main><h1>Post Review — {{ dealer.full_name }}</h1>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post" class="card">{% csrf_token %}<label for="purchase">Purchased a vehicle?</label><select name="purchase" id="purchase"><option value="yes">Yes</option><option value="no">No</option></select><label for="car_make">Car make</label><input required name="car_make" id="car_make" placeholder="Toyota"><label for="car_model">Car model</label><input required name="car_model" id="car_model" placeholder="Camry"><label for="car_year">Car year</label><input required name="car_year" id="car_year" type="number" min="1950" max="2100" value="2024"><label for="review">Your review</label><textarea required name="review" id="review" rows="5" placeholder="Describe your experience"></textarea><p><button type="submit">Post Review</button></p></form></main></body></html>
